<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR 7 Kebiasaan-2</title><meta itemprop="name" content="Empty Project"><meta name="twitter:title" content="Empty Project"><meta property="og:title" content="Empty Project"><meta property="og:site_name" content="Empty Project"><meta name="description" content="Start with a blank project."><meta itemprop="description" content="Start with a blank project."><meta property="og:description" content="Start with a blank project."><meta name="twitter:description" content="Start with a blank project."><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script><style>html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* CONTAINER TOMBOL PENJELASAN */
    #ui-container {
      position: fixed;
      left: 50%;
      right: auto;
      top: auto;
      bottom: max(40px, env(safe-area-inset-bottom));
      width: clamp(130px, 15vw, 210px);
      height: auto;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
    }

    /* TOMBOL PENJELASAN */
    .tombol-ganti {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      object-fit: contain;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease;
    }

    .tombol-ganti:active {
      transform: scale(0.9);
    }

    /* CONTAINER TOMBOL BACK */
    #back-container {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 0px));
      left: max(20px, env(safe-area-inset-left, 0px));
      right: auto;
      bottom: auto;
      width: 55px;
      height: auto;
      z-index: 100000;
    }

    #back-container a {
      display: block;
      width: 100%;
      height: auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* TOMBOL BACK */
    #btn-back {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      object-fit: contain;
      transform: rotate(0deg);
      transform-origin: center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #btn-back:active {
      transform: scale(0.9);
    }

    /* HP PORTRAIT */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      #ui-container {
        width: 130px;
      }

      #back-container {
        width: 52px;
      }
    }

    /* TABLET PORTRAIT */
    @media screen and (min-width: 601px) and (orientation: portrait) {
      #ui-container {
        width: clamp(200px, 28vw, 300px);
      }

      #back-container {
        width: 85px;
      }
    }

    /* LANDSCAPE */
    @media screen and (orientation: landscape) {
      #ui-container {
        width: clamp(160px, 22vw, 300px);
      }

      #back-container {
        width: clamp(55px, 7vw, 100px);
      }
    }

    /* LANDSCAPE DENGAN TINGGI LAYAR PENDEK */
    @media screen and (orientation: landscape) and (max-height: 450px) {
      #ui-container {
        width: clamp(150px, 18vw, 240px);
      }

      #back-container {
        width: 55px;
      }
    }</style></head><body><div id="back-container"><a href="arpaud://launcher"><img id="btn-back" src="assets/btn_red_prev_1.png" alt="Back"></a></div><div id="ui-container"><img class="tombol-ganti" id="btn-penjelasan" src="assets/Frame_9.png" alt="Penjelasan"></div><audio id="audio-penjelasan" src=""></audio><script src="bundle.js"></script></body></html>
